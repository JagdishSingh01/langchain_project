[project]
name = "langchain-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JagdishSingh01", email = "jatinpawar354@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "ipykernel>=7.3.0",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.4",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.5.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
]

[project.scripts]
langchain-project = "langchain_project:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
